# AI HOT 仪表盘 · 定时更新静态快照并部署到 GitHub Pages
#
# 触发方式：
#   1. 定时：每天北京时间 08:00 / 13:00 / 20:00（cron 使用 UTC，0/5/12 = 北京 8/13/20 点）
#   2. 手动：仓库 Actions 页 → 选中本工作流 → "Run workflow" 按钮
#
# 流程:
#   checkout → 生成静态快照（aihot API + 只读消费 data/manus/current.json → 历史归档
#     upsert/定稿/滚动清理 → public/index.html + public/history/ + public/weekly/）
#   → 校验数据 → 提交回仓库（contents: write，含 archive/ 归档数据）→ 部署到 GitHub Pages
#
# 公众号信源：由独立的 fetch-manus.yml 工作流生产 data/manus/current.json；
# 本工作流不调用、不等待 Manus；feed 缺失/损坏/过期时降级为仅 aihot 数据，页面显示降级状态。
#
# 固定访问链接：https://wadeliuastro.github.io/AI-HOT/
# 前置条件：仓库 Settings → Pages → Source 选择 "GitHub Actions"
# 可选 Secret：DEEPSEEK_API_KEY（AI 打标签；缺失时静默降级为无标签，不阻断发布）
# 注：WeRead/搜狗路线已于 2026-08-17 迁移为 Manus 唯一信源（见 fetch-manus.yml）

name: 定时更新静态快照并部署

on:
  schedule:
    # 每天北京时间 08:00 / 13:00 / 20:00 = UTC 00:00 / 05:00 / 12:00（GitHub cron 固定 UTC）
    - cron: "0 0,5,12 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否部署到 GitHub Pages（取消勾选则只生成并提交快照）"
        type: boolean
        default: true

# GITHUB_TOKEN 需要写权限才能把生成的文件提交回仓库、创建告警 Issue；
# pages/id-token 权限是官方 Pages 部署 action（deploy-pages）必需
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# 防止上一次运行还没结束、下一次定时触发时并发冲突
concurrency:
  group: ai-hot-snapshot
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成静态快照（aihot API + Manus feed 合并 + 历史归档）
        # 只读消费最近一次成功的 data/manus/current.json；feed 缺失/损坏/过期时
        # build_snapshot.py 自动降级为仅 aihot 数据，页面 mpStatus 显示降级状态
        run: python3 scripts/build_snapshot.py --out public/index.html --manus-json data/manus/current.json

      - name: 校验快照（日报/周报均有数据且 JSON 合法）
        run: |
          python3 - <<'EOF'
          import json
          html = open("public/index.html", encoding="utf-8").read()
          start = html.index("const DATA = ") + len("const DATA = ")
          data = json.loads(html[start: html.index(";\n", start)])
          for view in ("daily", "weekly"):
              p = data[view]
              assert p["total"] > 0, f"{view} 无数据"
              print(f"{view}: total={p['total']} range={p['range']['label']} mpStatus={p['mpStatus']['connected']}")
          EOF

      - name: 提交快照回仓库（若内容有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/history public/weekly archive
          # 打标签产物存在时才入库（配置 DEEPSEEK_API_KEY / 完成 golden 标注后自动生效）
          if [ -f tag_cache.json ]; then git add tag_cache.json; fi
          if [ -f eval/golden.json ]; then git add eval/golden.json; fi
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: 更新 AI HOT 静态快照 [skip ci]"
            # 先拉取远端（避免与他人/并发运行/Manus 工作流的提交冲突），再推送
            git pull --rebase origin main
            git push
          fi

      - name: 准备 Pages 产物（站点根目录，含历史归档页）
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.deploy != 'false') }}
        run: |
          mkdir -p _site
          cp -r public/. _site/

      - name: 上传 Pages 产物
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.deploy != 'false') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.deploy != 'false') }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 显示固定访问链接
        if: ${{ steps.deployment.outputs.page_url != '' }}
        run: |
          echo "### ✅ 看板已更新，固定访问链接：" >> $GITHUB_STEP_SUMMARY
          echo "[AI HOT 仪表盘](https://wadeliuastro.github.io/AI-HOT/)" >> $GITHUB_STEP_SUMMARY
